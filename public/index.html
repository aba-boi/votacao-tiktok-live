<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle da votação</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#11111b;color:#fff;font:16px Arial}main{max-width:600px;margin:auto}.card{background:#222235;padding:16px;border-radius:15px;margin:14px 0}input,button,select{width:100%;padding:12px;border-radius:9px;border:0;margin:5px 0;font-size:16px}input,select{background:#151522;color:#fff;border:1px solid #55556a}button{font-weight:bold;background:#eee;color:#171725}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.blue{background:#438bff}.red{background:#ff6565}.muted{background:#44445c;color:white}.small{font-size:13px;color:#ccc}#status{padding:10px;background:#151522;border-radius:8px}</style></head><body><main><h1>Controle da votação</h1><p>Registre os votos manualmente.</p>
<div class="card"><div id="status">Carregando...</div><h2 id="scores">Lula 0 · Flávio 0</h2><label>Candidato</label><select id="candidate"><option value="lula">Lula</option><option value="flavio">Flávio Bolsonaro</option></select><label>Quantidade de votos</label><input id="amount" type="number" min="1" step="1" value="1"><div class="row"><button class="blue" id="vl">Registrar para Lula</button><button class="red" id="vf">Registrar para Flávio</button></div><p class="small">Os votos só podem ser registrados durante um turno ativo.</p></div>
<div class="card"><h2>Turno</h2><div class="row"><button id="start">Iniciar (10 min)</button><button class="muted" id="end">Encerrar</button></div><div class="row"><button class="muted" id="next">Próximo turno</button><button class="muted" id="reset">Zerar tudo</button></div></div>
<div class="card"><h2>Mensagens do placar</h2><label>Frase principal fixa</label><input id="promo" maxlength="100" value="Outros presentes garantem mais votos!"><label>Frase secundária alternada</label><input id="secondary" maxlength="120" value="Apoie seu candidato e ajude a virar o placar!"><button id="save">Salvar mensagens</button></div>
<div class="card"><h2>Histórico</h2><div id="history" class="small">Nenhum turno encerrado.</div></div><p class="small">Placar público: /placar.html</p></main><script>
const $=x=>document.getElementById(x);async function post(path,body={}){try{let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');render(d.state)}catch(e){alert(e.message)}}
function render(s){$('status').textContent=s.message+ (s.running?' · EM ANDAMENTO':s.finished?' · ENCERRADO':' · AGUARDANDO');$('scores').textContent=`Turno ${s.round} — Lula ${s.lula} · Flávio ${s.flavio}`;$('start').disabled=s.running;$('end').disabled=!s.running;$('next').disabled=!s.finished;$('vl').disabled=$('vf').disabled=!s.running;if(document.activeElement!==$('promo'))$('promo').value=s.promoMessage;if(document.activeElement!==$('secondary'))$('secondary').value=s.secondaryMessage;$('history').innerHTML=s.history.length?s.history.slice().reverse().map(h=>`Turno ${h.round}: Lula ${h.lula} × Flávio ${h.flavio} — ${h.result}`).join('<br>'):'Nenhum turno encerrado.'}
$('vl').onclick=()=>post('vote',{candidate:'lula',amount:Number($('amount').value)});$('vf').onclick=()=>post('vote',{candidate:'flavio',amount:Number($('amount').value)});$('start').onclick=()=>post('start');$('end').onclick=()=>post('end');$('next').onclick=()=>post('next');$('reset').onclick=()=>{if(confirm('Zerar a pontuação e o histórico?'))post('reset')};$('save').onclick=()=>post('message',{promoMessage:$('promo').value,secondaryMessage:$('secondary').value});async function refresh(){try{let r=await fetch('/api/state',{cache:'no-store'});render(await r.json())}catch(e){$('status').textContent='Reconectando...'}}refresh();setInterval(refresh,2000);
</script></body></html>
