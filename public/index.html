<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duelo da LIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif;padding:18px}
main{max-width:760px;margin:auto}
h1{text-align:center;font-size:30px}
.sub{text-align:center;color:#bbb}
input,button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:9px;font-size:16px}
input{background:#25262d;color:white}
button{font-weight:bold;cursor:pointer;background:#444;color:white}
button:disabled{opacity:.5}
.vermelho{background:#e04455}
.azul{background:#4287ff}
.verde{background:#188c60}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.cartao{background:#20212a;border-radius:14px;padding:16px;text-align:center}
.bandeira{font-size:35px}
.nome{font-size:20px;font-weight:bold;margin:8px 0}
.contar{font-size:36px;font-weight:bold;margin:12px}
.pequeno{font-size:13px;color:#bbb}
#status,#resultado{margin-top:16px;padding:14px;background:#20212a;border-radius:10px;text-align:center;overflow-wrap:anywhere}
#temporizador{text-align:center;font-size:34px;font-weight:bold;margin:20px}
.controles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h2{font-size:18px;margin-top:24px}
@media(max-width:420px){body{padding:10px}.grade{gap:8px}.cartao{padding:10px}}
</style>
</head>
<body>
<main>
<h1>⚔️ DUELO DA LIVE</h1>
<p class="sub">Cada presente vale um voto</p>

<label for="usuario">Usuário da LIVE no TikTok (sem @)</label>
<input id="usuario" placeholder="Ex.: seu_usuario">
<button id="conectar" class="azul">Conectar à LIVE</button>
<div id="status">Carregando painel...</div>

<div id="temporizador">10:00</div>

<div class="grade">
  <div class="cartao">
    <div class="bandeira">🌹</div>
    <div class="nome">LULA</div>
    <div>PT · Partido dos Trabalhadores</div>
    <div class="contar" id="lula">0</div>
    <div class="pequeno">Rosa 🌹 = 1 voto</div>
  </div>
  <div class="cartao">
    <div class="bandeira">🤍</div>
    <div class="nome">FLÁVIO BOLSONARO</div>
    <div>Brasil</div>
    <div class="contar" id="flavio">0</div>
    <div class="pequeno">Rosa branca 🤍 = 1 voto</div>
  </div>
</div>

<div id="resultado">Conecte-se e inicie o turno.</div>

<div class="controles">
  <button id="iniciar" class="verde">Iniciar turno</button>
  <button id="finalizar" class="vermelho">Finalizar turno</button>
  <button id="proximo">Próximo turno</button>
  <button id="reiniciar">Zerar votação</button>
</div>

<h2>Histórico</h2>
<div id="historico" class="pequeno">Nenhum turno finalizado.</div>
</main>

<script>
const $ = id => document.getElementById(id);

async function requisicao(url, dados) {
  const resposta = await fetch(url, {
    method: dados ? "POST" : "GET",
    headers: {"Content-Type":"application/json"},
    body: dados ? JSON.stringify(dados) : undefined
  });
  const resultado = await resposta.json();
  if (!resposta.ok) throw new Error(resultado.error || "Erro na solicitação.");
  return resultado;
}

function mostrar(s) {
  $("status").textContent = s.message || "Status desconhecido";
  $("lula").textContent = s.lula ?? 0;
  $("flavio").textContent = s.flavio ?? 0;

  const segundos = s.running ? (s.remaining || 0) : (s.finished ? 0 : 600);
  $("temporizador").textContent =
    String(Math.floor(segundos / 60)).padStart(2,"0") + ":" +
    String(segundos % 60).padStart(2,"0");

  if (s.finished) {
    $("resultado").textContent = s.winner === "draw"
      ? "Empate!"
      : s.winner === "lula" ? "Lula venceu o turno!" : "Flávio Bolsonaro venceu o turno!";
  } else {
    $("resultado").textContent = s.running
      ? "Turno " + s.round + " em andamento!"
      : "Turno " + s.round + (s.connected ? " · Pronto para iniciar." : " · Conecte-se à LIVE.");
  }

  $("historico").textContent = s.history && s.history.length
    ? s.history.map(h => "Turno " + h.round + ": " + h.result +
        " (Lula " + h.lula + " × " + h.flavio + " Flávio)").join(" | ")
    : "Nenhum turno finalizado.";
}

async function atualizar() {
  try {
    const s = await requisicao("/api/state");
    mostrar(s);
  } catch (e) {
    $("status").textContent = "Não foi possível carregar o painel: " + e.message;
  }
}

$("conectar").addEventListener("click", async () => {
  const usuario = $("usuario").value.trim().replace(/^@/, "");
  if (!usuario) {
    alert("Digite seu usuário público do TikTok, sem @.");
    return;
  }
  $("conectar").disabled = true;
  $("status").textContent = "Tentando conectar à LIVE...";
  try {
    const r = await requisicao("/api/connect", {username:usuario});
    mostrar(r.state);
  } catch (e) {
    $("status").textContent = e.message;
    alert("Não foi possível conectar: " + e.message);
  } finally {
    $("conectar").disabled = false;
  }
});

$("iniciar").addEventListener("click", async () => {
  try { mostrar((await requisicao("/api/start", {})).state); }
  catch(e) { alert(e.message); }
});

$("finalizar").addEventListener("click", async () => {
  try { mostrar((await requisicao("/api/end", {})).state); }
  catch(e) { alert(e.message); }
});

$("proximo").addEventListener("click", async () => {
  try { mostrar((await requisicao("/api/next", {})).state); }
  catch(e) { alert(e.message); }
});

$("reiniciar").addEventListener("click", async () => {
  if (!confirm("Deseja zerar a votação e o histórico?")) return;
  try { mostrar((await requisicao("/api/reset", {})).state); }
  catch(e) { alert(e.message); }
});

atualizar();
setInterval(atualizar, 2000);
</script>
</body>
</html>
