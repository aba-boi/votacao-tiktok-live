<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placar da LIVE</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101018;color:white;font-family:Arial,sans-serif;padding:20px 14px;text-align:center}.tag{color:#b9b9ce;font-size:13px;letter-spacing:2px}h1{font-size:clamp(23px,7vw,36px);margin:12px 0 6px}#round{color:#c5c5d8;margin-bottom:22px}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{padding:18px 8px;border-radius:18px;background:#222235;border:2px solid #44445c}.lula{border-color:#438bff}.flavio{border-color:#ff6565}.name{font-size:clamp(15px,4vw,22px);font-weight:800}.score{font-size:clamp(42px,13vw,66px);font-weight:900;margin:14px 0}.lula .score{color:#77adff}.flavio .score{color:#ff8585}.votes{font-size:12px;color:#c5c5d8}.bar{display:flex;height:14px;overflow:hidden;border-radius:20px;background:#353548;margin:24px 0 10px}#blue{background:#438bff;width:50%}#red{background:#ff6565;width:50%}.percentages{display:flex;justify-content:space-between;font-size:13px;color:#d8d8e8}.timer{font-size:42px;font-weight:900;margin:25px 0 8px}#message{color:#d0d0e2;font-size:15px;margin-top:14px}.promo{margin:22px auto 0;padding:16px 12px;max-width:520px;border-radius:16px;background:#25253a;border:1px solid #484866}#promo{font-size:clamp(17px,4.5vw,23px);font-weight:900;color:#ffe19a;min-height:1.3em}#secondary{font-size:14px;color:#e0dfee;margin-top:9px;min-height:1.2em}.footer{margin-top:25px;color:#77778f;font-size:11px}</style></head><body><div class="tag">VOTAÇÃO AO VIVO</div><h1>QUEM VAI VENCER?</h1><div id="round">TURNO 1</div><div class="players"><div class="player lula"><div class="name">LULA</div><div class="score" id="lula">0</div><div class="votes">VOTOS</div></div><div class="player flavio"><div class="name">FLÁVIO</div><div class="score" id="flavio">0</div><div class="votes">VOTOS</div></div></div><div class="bar"><div id="blue"></div><div id="red"></div></div><div class="percentages"><span id="bp">50%</span><span id="rp">50%</span></div><div class="timer" id="timer">10:00</div><div id="message">Aguardando o início da votação</div><div class="promo"><div id="promo">Outros presentes garantem mais votos!</div><div id="secondary">Apoie seu candidato e ajude a virar o placar!</div></div><div class="footer">PLACAR DA TRANSMISSÃO</div><script>
let secondary='',flip=false;async function update(){try{let r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();$('lula').textContent=s.lula;$('flavio').textContent=s.flavio;$('round').textContent='TURNO '+s.round;let total=s.lula+s.flavio,b=total?Math.round(s.lula/total*100):50,red=100-b;$('blue').style.width=b+'%';$('red').style.width=red+'%';$('bp').textContent=b+'%';$('rp').textContent=red+'%';let sec=s.running?s.remaining:s.finished?0:600;$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('message').textContent=s.finished?'RESULTADO: '+(s.lula===s.flavio?'EMPATE!':s.lula>s.flavio?'LULA VENCEU!':'FLÁVIO VENCEU!'):s.running?'VOTAÇÃO EM ANDAMENTO':'AGUARDANDO O INÍCIO DA VOTAÇÃO';$('promo').textContent=s.promoMessage||'Outros presentes garantem mais votos!';let next=s.secondaryMessage||'Apoie seu candidato e ajude a virar o placar!';if(next!==secondary){secondary=next;$('secondary').textContent=secondary}}catch(e){$('message').textContent='Reconectando ao placar...'}}const $=id=>document.getElementById(id);update();setInterval(update,1000);setInterval(()=>{flip=!flip;$('secondary').style.opacity=flip?'1':'.5'},3500);
</script></body></html>
